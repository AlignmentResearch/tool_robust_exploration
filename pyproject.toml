[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-robust-poc"
version = "0.1.0"
description = "POC experiments for tool-result wrapping and prompt robustness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.14.0",
    "fllmingo",
    "matplotlib>=3.10.8",
]

[tool.uv.sources]
fllmingo = { path = "../utils/fllmingo", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
